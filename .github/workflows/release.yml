name: Release

on:
  push:
    tags: ['v*']

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: v0.11.0

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  macos:
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          # Each leg builds the architecture it will package (family
          # release.yml macos matrix pattern).
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}' crypto
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package
        run: raco rivet package
      - name: Portable zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qry "pdfgist-${VERSION}-macos-${{ matrix.arch }}.zip" pdfgist.app
          shasum -a 256 "pdfgist-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "pdfgist-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG, drag to Applications)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/pdfgist.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PDFGist ${VERSION}" -srcfolder "$staging" -ov -format UDZO \
            "dist/pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg"
          hdiutil attach "dist/pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            -mountpoint "$RUNNER_TEMP/dmg-verify" -readonly
          test -d "$RUNNER_TEMP/dmg-verify/pdfgist.app"
          hdiutil detach "$RUNNER_TEMP/dmg-verify"
          cd dist
          shasum -a 256 "pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/pdfgist-*
          if-no-files-found: error

  windows:
    name: Windows (MSI + portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install crypto (updater dependency)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto
      - name: Install WiX (v5; rivet's MSI toolchain)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # MSI + portable zip + SBOM + notices, launch smoke included (the
      # taskly windows release shape). The portable zip is the update-feed
      # entry; the publish job assembles and signs the merged manifest.
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet v0.11.0 names the MSI and the portable zip in family form
          # already; only the SBOM/notices lack the platform segment.
          mv sbom.cdx.json "pdfgist-${VERSION}-windows-x64.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "pdfgist-${VERSION}-windows-x64-THIRD_PARTY_NOTICES.txt"
          for f in pdfgist-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference (the taskly 1.4.0 leftover). Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/pdfgist-*
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}' crypto
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/macos-package-arm64/* artifacts/macos-package-x64/* dist/
          mv artifacts/windows-package/* dist/
      - name: Sign the update feed over the final zips
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::warning::UPDATE_ED25519_PRIVATE_KEY_B64 not set — release ships without an update manifest"
            exit 0
          fi
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Notes = CHANGELOG section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          head -3 /tmp/notes.md
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/pdfgist >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/pdfgist
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/pdfgist \
              --title "PDFGist ${VERSION}" \
              --notes-file /tmp/notes.md
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - name: Stable alias copies (versionless direct-download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Family rule: download buttons point at
          # releases/latest/download/<alias>, so every release also ships
          # versionless copies of the primary installers (dmg per macOS
          # arch, MSI for Windows). Deliberately after the provenance
          # attestation so dist/* there stays versioned-only.
          mkdir -p stable-alias
          cp "dist/pdfgist-${VERSION}-macos-arm64.dmg" stable-alias/pdfgist-macos-arm64.dmg
          cp "dist/pdfgist-${VERSION}-macos-x64.dmg" stable-alias/pdfgist-macos-x64.dmg
          cp "dist/pdfgist-${VERSION}-windows-x64.msi" stable-alias/pdfgist-windows-x64.msi
          gh release upload "${{ github.ref_name }}" stable-alias/* --clobber -R turinglambdaai/pdfgist
