name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  macos:
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          # Each leg builds the architecture it will package (family
          # release.yml macos matrix pattern).
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs rivet crypto
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package
        run: raco rivet package
      - name: Portable zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qry "pdfgist-${VERSION}-macos-${{ matrix.arch }}.zip" pdfgist.app
          shasum -a 256 "pdfgist-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "pdfgist-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG, drag to Applications)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/pdfgist.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "PDFGist ${VERSION}" -srcfolder "$staging" -ov -format UDZO \
            "dist/pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg"
          hdiutil attach "dist/pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            -mountpoint "$RUNNER_TEMP/dmg-verify" -readonly
          test -d "$RUNNER_TEMP/dmg-verify/pdfgist.app"
          hdiutil detach "$RUNNER_TEMP/dmg-verify"
          cd dist
          shasum -a 256 "pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "pdfgist-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: dist/pdfgist-*
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs rivet crypto
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mv artifacts/macos-package-arm64/* artifacts/macos-package-x64/* dist/
      - name: Sign the update feed over the final zips
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            echo "::warning::UPDATE_ED25519_PRIVATE_KEY_B64 not set — release ships without an update manifest"
            exit 0
          fi
          KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Notes = CHANGELOG section for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          head -3 /tmp/notes.md
      - name: SHA256SUMS
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/pdfgist >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/pdfgist
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/pdfgist \
              --title "PDFGist ${VERSION}" \
              --notes-file /tmp/notes.md
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
