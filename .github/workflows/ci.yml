name: CI
on:
  push:
  pull_request:

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: v0.11.0

jobs:
  contract:
    name: Contract preflight (release metadata + i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version alignment (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh
      - name: Verify the WinUI i18n table matches shared/i18n
        run: node scripts/gen-win-strings.mjs --check

  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}' crypto
      - name: Domain core tests
        run: raco test racket/

  windows-host:
    name: Windows host (WinUI3 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Racket CS 9.3
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      # The backend's pdf FFI (pdfdoc.rkt binds zlib) is instantiated while
      # `raco rivet build` assembles the codegen contract, so zlib1.dll must
      # be on PATH first; the same cache copy rides into the packaged stage.
      - name: Locate zlib for the backend FFI
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "windows\locate-zlib.ps1" -ProjectDir "windows"
          $out | Write-Host
          $dir = ($out | Select-String -Pattern 'ZLIBDIR=(.+)').Matches.Groups[1].Value
          (Resolve-Path $dir).Path >> $env:GITHUB_PATH
      # MSBuild + NuGet restore; fetch-pdfium.ps1 downloads the pinned
      # PDFium binaries (sha256-verified) into the gitignored cache.
      - name: Build host
        shell: pwsh
        run: raco rivet build
      - name: Launch smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".rivet\stage\RivetHost.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "RivetHost.exe exited during smoke"; exit 1 }
          Stop-Process -Id $p.Id -Force

  linux-host:
    name: Linux host (${{ matrix.arch }} GTK4 build)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Builds and caches the embeddable Racket CS runtime and exports
      # RIVET_RACKET_* (rivet's own composite action, same as taskly).
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.11.0
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs the updater.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, WebKitGTK and packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libjson-glib-dev \
            libglib2.0-dev
      - name: Toolchain doctor
        run: raco rivet doctor --json
      # Configures the host CMake, which fetches the pinned PDFium binaries
      # (sha256-verified) and stages libpdfium.so beside the executable.
      - name: Build host
        run: |
          raco rivet build || true
          echo "=== webkitgtk include ground truth ==="
          dpkg -s libwebkitgtk-6.0-dev | head -3 || true
          dpkg -L libwebkitgtk-6.0-dev | head -25 || true
          find /usr/include -name "WebKitApplicationInfo.h" 2>/dev/null | head -3
          dpkg -S WebKitApplicationInfo.h 2>&1 | head -2 || true
          apt-cache search webkitgtk | head -5 || true
          apt-cache policy libwebkitgtk-6.0-dev libwebkit2gtk-4.1-dev | head -12 || true
          echo "=== epub compile flags ==="
          grep -A2 "CXX_INCLUDES\|epub.cpp.o" .rivet/build/linux/CMakeFiles/RivetHost.dir/flags.make | head -12 || true
          exit 1
      # Headless Wayland smoke: boot the app under weston and let the
      # embedded backend come up (dbus session for GSettings).
      - name: Headless Wayland smoke (weston)
        run: |
          sudo apt-get install -y at-spi2-core dbus-x11 weston
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-smoke"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -c '
            set -euo pipefail
            export XDG_RUNTIME_DIR
            export WAYLAND_DISPLAY=pdfgist-smoke
            export GDK_BACKEND=wayland
            unset DISPLAY
            weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" \
              --idle-time=0 &
            sleep 2
            ./.rivet/stage/RivetHost &
            APP_PID=$!
            sleep 12
            kill -0 $APP_PID
            kill $APP_PID
          '
